<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self';">
<title>EQL Parse — overlay</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background: transparent; overflow: hidden; }
  .ov { height: 100vh; display: flex; flex-direction: column;
        background: rgba(18,22,30,.88); border: 1px solid rgba(51,61,78,.85);
        opacity: .38; transition: opacity .45s ease; }
  /* Sin backdrop-filter a propósito: en una ventana transparente y siempre
     encima obliga al compositor a leer y desenfocar el juego entero en cada
     fotograma, y eso se nota muchísimo mientras juegas. El fondo sólido con
     algo de transparencia da un resultado parecido y no cuesta nada. */
  .ov.active, .ov:hover { opacity: 1; }
  .ov.flash { opacity: 1; border-color: var(--t-cold); }
  @media (prefers-reduced-motion: reduce) { .ov { transition: none; } }
  :root[data-theme="light"] .ov { background: rgba(248,245,239,.90); }
  :root[data-theme="light"] .ov-bar { background: rgba(229,224,213,.94); }

  .ov-bar { display: flex; align-items: center; gap: 8px; padding: 5px 7px;
            background: rgba(22,27,37,.92); border-bottom: 1px solid rgba(51,61,78,.7);
            -webkit-app-region: drag; flex: none; }
  .ov-bar .eyebrow { font-size: 9px; }
  .ov-bar .spacer { margin-left: auto; }
  .ov-btn { -webkit-app-region: no-drag; background: transparent; border: 0;
            color: var(--bone-faint); font-size: 11px; line-height: 1;
            padding: 3px 5px; cursor: pointer; border-radius: 2px;
            font-family: var(--display); letter-spacing: .08em; text-transform: uppercase; }
  .ov-btn:hover { color: var(--bone); background: rgba(255,255,255,.09); }
  .ov-btn.close:hover { color: #fff; background: var(--t-ds); }

  .ov-advice { margin: 4px 7px 0; padding: 4px 7px; font-size: 11px; flex: none;
               background: rgba(224,138,75,.15); border-left: 2px solid var(--t-fire); }

  /* La tira de sesión: fija arriba, nunca rota. Es la referencia de cómo vas
     tú en la sesión mientras los combates de abajo van cayendo. */
  .ov-ses { display: flex; align-items: baseline; gap: 7px; flex: none;
            padding: 4px 9px; border-bottom: 1px solid rgba(51,61,78,.7);
            background: rgba(139,123,216,.13); }
  .ov-ses .eyebrow { font-size: 9px; }
  .ov-ses .who { font-size: 11.5px; color: var(--t-cold); }
  .ov-ses .tot { margin-left: auto; font-family: var(--mono); font-size: 13px; }
  .ov-ses .rate { font-family: var(--mono); font-size: 9.5px; color: var(--bone-dim); }

  /* La pila de combates. El scroll vive aquí y no dentro de cada bloque: así
     los cerrados van bajando de verdad en vez de comprimirse. */
  .ov-stack { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
  .ov-stack::-webkit-scrollbar { width: 6px; }
  .ov-stack::-webkit-scrollbar-thumb { background: var(--slate-600); border-radius: 3px; }

  .ovf { border-bottom: 1px solid rgba(51,61,78,.5); }
  .ovf-h { display: flex; align-items: baseline; gap: 6px; padding: 4px 8px; cursor: pointer; }
  .ovf-h:hover { background: rgba(255,255,255,.05); }
  .ovf.live .ovf-h { background: rgba(111,199,216,.13); }
  .ovf.nueva .ovf-h { animation: ovf-in .9s ease-out; }
  @keyframes ovf-in { from { background: rgba(111,199,216,.4); } }
  @media (prefers-reduced-motion: reduce) { .ovf.nueva .ovf-h { animation: none; } }
  /* Copiar al chat. Va en la cabecera y no dentro de una fila: las filas se
     recolocan cuatro veces por segundo y un botón ahí se pierde entre
     repintados. Aparece al pasar por encima para no robar sitio, pero mientras
     dice «copiado» se queda visible — si no, el aviso se iría con el ratón. */
  .ovf-copy { flex: none; background: none; border: 1px solid var(--slate-700);
    color: var(--bone-faint); font-family: var(--display); font-size: 9px;
    letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px;
    cursor: pointer; opacity: 0; transition: opacity .12s; }
  .ovf-h:hover .ovf-copy, .ovf-copy:focus-visible,
  .ovf-copy.ok, .ovf-copy.bad { opacity: 1; }
  .ovf-copy:hover { border-color: var(--t-cold); color: var(--t-cold); }
  .ovf-copy.ok { border-color: var(--t-poison); color: var(--t-poison); }
  .ovf-copy.bad { border-color: var(--t-fire); color: var(--t-fire); }
  .ovf-caret { font-size: 8px; color: var(--bone-faint); width: 9px; flex: none; }
  .ovf-label { flex: 1; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ovf-tot { font-family: var(--mono); font-size: 11.5px; }
  .ovf-dur { font-family: var(--mono); font-size: 9.5px; color: var(--bone-faint); width: 40px; text-align: right; }

  /* Dos columnas dentro del bloque: los tuyos a la izquierda, los enemigos a
     la derecha. Los porcentajes de las dos son de ESTA pelea. */
  .ovf-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
              background: rgba(51,61,78,.4); }
  .ovf-col { background: rgba(18,22,30,.35); padding: 2px 8px 5px; min-width: 0; }
  :root[data-theme="light"] .ovf-col { background: rgba(255,253,248,.4); }
  .ovf-colh { display: flex; align-items: baseline; gap: 6px; padding: 1px 0 3px; }
  .ovf-colh .n { margin-left: auto; font-family: var(--mono); font-size: 10px; }

  .ov-row { padding: 3px 0; cursor: pointer; }
  .ov-row:hover .ov-name { color: #fff; }
  .ov-row.dead { opacity: .42; }
  .ov-row.open { background: rgba(255,255,255,.05); }
  .ov-top { display: flex; align-items: baseline; gap: 6px; }
  .ov-rank { font-family: var(--mono); font-size: 9px; color: var(--bone-faint); width: 13px; flex: none; }
  .ov-name { flex: 1; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ov-name.self { color: var(--t-cold); }
  .ov-dps { font-family: var(--mono); font-size: 12px; }
  .ov-pct { font-family: var(--mono); font-size: 9.5px; color: var(--bone-dim); width: 32px; text-align: right; }
  .ov-rate { font-family: var(--mono); font-size: 9.5px; color: var(--bone-faint); }
  .ov-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; flex: none; }
  .ov .bar { height: 5px; margin-top: 2px; background: rgba(26,32,43,.75); }
  .ov-det { margin: 4px 0 5px 19px; padding: 5px 8px; font-size: 10.5px;
            background: rgba(0,0,0,.22); border-left: 1px solid var(--slate-600); }
  :root[data-theme="light"] .ov-det { background: rgba(0,0,0,.06); }
  .ov-det-l { display: flex; gap: 7px; padding: 1px 0; }
  .ov-det-l span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ov-det-l b { font-family: var(--mono); font-weight: 500; }
  .ov-det-kv { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-bottom: 4px; color: var(--bone-dim); }
  .ov-kill { margin: 4px 7px 0; padding: 6px 8px; flex: none;
             background: rgba(168,199,79,.14); border-left: 2px solid var(--t-poison); }
  .ok-h { display: flex; align-items: baseline; gap: 7px; margin-bottom: 4px; font-size: 12px; }
  .ok-h .spacer { margin-left: auto; }
  .ok-row { display: flex; align-items: center; gap: 6px; padding: 1px 0; font-size: 11px; }
  .ok-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ok-pct { width: 30px; text-align: right; color: var(--bone-dim); font-size: 10px; }
  .ok-bar { width: 60px; height: 4px; background: rgba(26,32,43,.7); flex: none; }
  .ok-bar div { height: 100%; background: var(--t-poison); }
  .ov-empty { padding: 14px 8px; text-align: center; color: var(--bone-faint); font-size: 10.5px; }
</style>
</head>
<body>
  <div class="ov">
    <div class="ov-bar">
      <span class="eyebrow" id="oTitle">EQL &lt;SPAIN&gt;</span>
      <span class="eyebrow spacer num" id="oMeta"></span>
      <button class="ov-btn" id="oReset">reset</button>
      <button class="ov-btn" id="oPass">◎</button>
      <button class="ov-btn close" id="oClose">✕</button>
    </div>
    <div class="ov-ses" id="oSession"></div>
    <div class="ov-kill" id="oKill" style="display:none"></div>
    <div class="ov-advice" id="oAdvice" style="display:none"></div>
    <div class="ov-stack" id="oStack">
      <div id="oLive"></div>
      <div id="oClosed"></div>
    </div>
  </div>
  <script type="module" src="overlay.js"></script>
</body>
</html>
