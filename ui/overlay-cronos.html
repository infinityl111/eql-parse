<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self';">
<title>EQL Parse — temporizadores</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background: transparent; overflow: hidden; margin: 0; }

  /* La misma atenuación que el overlay principal: se aparta cuando no lo miras
     y vuelve entero al pasar por encima. La opacidad que elige el jugador NO
     va aquí — la aplica la ventana, porque este canal ya está ocupado. */
  .pan { height: 100vh; display: flex; flex-direction: column; position: relative;
         background: rgba(18,22,30,.88); border: 1px solid rgba(51,61,78,.85);
         opacity: .45; transition: opacity .45s ease; }
  .pan.active, .pan:hover { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .pan { transition: none; } }
  :root[data-theme="light"] .pan { background: rgba(248,245,239,.90); }

  .pan-bar { display: flex; align-items: center; gap: 8px; padding: 5px 7px;
             background: rgba(22,27,37,.92); border-bottom: 1px solid rgba(51,61,78,.7);
             -webkit-app-region: drag; flex: none; }
  :root[data-theme="light"] .pan-bar { background: rgba(229,224,213,.94); }
  .pan-bar .spacer { margin-left: auto; }
  .pan-z { font-size: 9.5px; color: var(--bone-faint); overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; max-width: 12em; }

  .pan-lista { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0;
               list-style: none; margin: 0; padding: 0; }
  .pan-lista::-webkit-scrollbar { width: 6px; }
  .pan-lista::-webkit-scrollbar-thumb { background: var(--slate-600); border-radius: 3px; }

  .pan-l { display: grid; grid-template-columns: 1fr auto auto 18px; gap: 7px;
           align-items: baseline; padding: 4px 8px;
           border-bottom: 1px solid rgba(51,61,78,.45); }
  .pan-l:last-child { border-bottom: 0; }
  .pan-n { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pan-t { font-family: var(--mono); font-variant-numeric: tabular-nums;
           font-size: 13px; color: var(--bone); }
  /* Lo accionable se distingue por COLOR además de por posición: el orden se
     pierde de un vistazo en cuanto hay ocho, y el color no. */
  .pan-ya .pan-t { color: var(--t-poison); font-size: 11px; }
  .pan-ya { background: rgba(168,199,79,.10); }
  .pan-h { font-size: 9px; color: var(--bone-faint); white-space: nowrap; }
  .pan-x { -webkit-app-region: no-drag; background: transparent; border: 0;
           color: var(--bone-faint); font-size: 13px; line-height: 1; padding: 0;
           cursor: pointer; }
  .pan-x:hover { color: #fff; background: var(--t-ds); border-radius: 2px; }

  .pan-vacio { flex: 1; display: flex; align-items: center; justify-content: center;
               padding: 14px; text-align: center; font-size: 11px;
               color: var(--bone-faint); font-style: italic; }

  /* ── EL MARCO, de `ui/marco-overlay.js` ─────────────────────────────────
     Las esquinas son nodos nuestros porque una ventana sin marco nativo no
     trae bordes de redimensión que funcionen. Doce píxeles: bastante para
     acertar con el ratón, poco para no comerse el contenido. */
  .mo-esq { position: fixed; width: 12px; height: 12px; z-index: 9;
            -webkit-app-region: no-drag; }
  .mo-no { top: 0; left: 0; cursor: nwse-resize; }
  .mo-ne { top: 0; right: 0; cursor: nesw-resize; }
  .mo-so { bottom: 0; left: 0; cursor: nesw-resize; }
  .mo-se { bottom: 0; right: 0; cursor: nwse-resize; }
  .mo-esq:hover { background: rgba(111,199,216,.35); }

  /* Los dos mandos juntos y abajo: aparecen al pasar el ratón y no ocupan sitio
     mientras no los usas. Van FUERA de lo que escala el tamaño, o al agrandar
     la letra se agrandarían ellos y se comerían el panel. */
  .mo-mandos { position: fixed; bottom: 2px; left: 50%; transform: translateX(-50%);
               z-index: 8; display: flex; align-items: center; gap: 10px;
               -webkit-app-region: no-drag; opacity: 0; transition: opacity .2s; }
  .pan:hover .mo-mandos, .mo-mandos:focus-within { opacity: 1; }
  .mo-op, .mo-le { display: flex; align-items: center; gap: 4px; }
  .mo-op-i, .mo-le-i { font-size: 10px; color: var(--bone-faint); }
  .mo-le-i { font-weight: 700; }
  .mo-op input, .mo-le input { width: 62px; height: 3px; accent-color: var(--t-cold); }

  /* EL TAMAÑO ESCALA EL CONTENIDO, no la ventana ni los mandos. `zoom` y no
     `font-size` porque las medidas de este panel están en píxeles: cambiar la
     letra sola dejaría las filas del mismo alto y el texto cortado. */
  .pan-bar, .pan-lista, .pan-vacio { zoom: var(--mo-letra, 1); }
</style>
</head>
<body>
  <div class="pan" id="pan"></div>
  <script type="module" src="overlay-cronos.js"></script>
</body>
</html>
